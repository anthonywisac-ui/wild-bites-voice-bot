providers = ["python"]
 
[variables]
NIXPACKS_PYTHON_VERSION = "3.11"
 
[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "ffmpeg", "libopus", "gcc", "pkg-config"]
nixLibs = ["libopus", "libsrtp"]
 
[phases.install]
cmds = [
    "python -m venv --copies /opt/venv",
    ". /opt/venv/bin/activate && pip install --upgrade pip",
    ". /opt/venv/bin/activate && pip install -r requirements.txt"
]
 
[start]
cmd = ". /opt/venv/bin/activate && python bot.py"