providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.11"

[phases.setup]
nixPkgs = [
    "python311",
    "python311Packages.pip",
    "ffmpeg",
    "libopus",
    "gcc",
    "pkg-config",
    "xorg.libxcb",
    "xorg.libX11",
    "libGL",
    "glib"
]
nixLibs = ["libopus", "libsrtp"]

[phases.install]
cmds = [
    "python -m venv --copies /opt/venv",
    ". /opt/venv/bin/activate && pip install --upgrade pip",
    ". /opt/venv/bin/activate && pip install -r requirements.txt",
    ". /opt/venv/bin/activate && pip uninstall -y opencv-python opencv-contrib-python || true",
    ". /opt/venv/bin/activate && pip install opencv-python-headless"
]

[start]
cmd = ". /opt/venv/bin/activate && python bot.py"